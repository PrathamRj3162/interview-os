name: Keep Supabase awake

# Free Supabase projects pause after about a week without database activity.
# Every 3 days, run one trivial read-only query (public.ping(), migration 0008). Costs nothing.
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then echo "Set the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets."; exit 1; fi
          status=$(curl -s -o /tmp/out -w "%{http_code}" -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $status $(cat /tmp/out)"
          test "$status" = "200"
